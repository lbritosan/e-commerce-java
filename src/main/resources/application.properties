# ==========================================
# 💾 1. CONEXÃO COM O POSTGRESQL (DOCKER)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/lojadb
spring.datasource.username=admin
spring.datasource.password=root
spring.datasource.driverClassName=org.postgresql.Driver

# Configurações do Hibernate para criar as tabelas no Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# 🔒 2. SEGURANÇA E GERENCIAMENTO DE TOKENS (JWT)
# ==========================================
# Uma chave secreta de teste de 256-bits codificada em Base64
jwt.secret=9a4f2c8d3e1b7f6a5c4d3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e

# Vincula a propriedade que o SecurityConfig está procurando
spring.security.oauth2.resourceserver.jwt.secret-key-value=${jwt.secret}
