spring.application.name=e-commerce

# Habilita o console visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configura o banco de dados em memória
spring.datasource.url=jdbc:h2:mem:lojadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configura o Hibernate para criar as tabelas automaticamente com base nas classes Java
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console da IDE (excelente para aprender e debugar)
spring.jpa.show-sql=true

# Uma chave secreta de teste de 256-bits codificada em Base64
jwt.secret=9a4f2c8d3e1b7f6a5c4d3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e

# Indica ao Spring que usaremos essa chave para validar os tokens digitais JWT
spring.security.oauth2.resourceserver.jwt.secret-key-value=${jwt.secret}
